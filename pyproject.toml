[project]
name = "guardrail-trader"
version = "0.1.0"
description = "Autonomous trading agent: Claude proposes, code decides."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "ib_async",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["guardrail_trader*"]
