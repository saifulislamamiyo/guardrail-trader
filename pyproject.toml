[project]
name = "guardrail-trader"
version = "0.1.0"
description = "Autonomous trading agent: Claude proposes, code decides."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "ib_async",
    "python-dotenv",
    "tzdata",          # zoneinfo data for slim containers (New York / Sydney slot logic)
]

[project.optional-dependencies]
dev = ["pytest"]
tools = ["pandas", "lxml", "openpyxl", "requests"]   # scripts/refresh_universe.py
docs = ["mkdocs<2", "mkdocs-material"]              # docs site (MkDocs 2.0 breaks Material)
screenshots = ["playwright"]                         # scripts/screenshot_dashboard.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["guardrail_trader*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"   # containers run as a non-root user without a writable cache dir
