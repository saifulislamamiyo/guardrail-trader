name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.12"
          python-version: "3.13"
      - run: uv lock --check                       # uv.lock matches pyproject.toml
      - run: uv sync --frozen --extra dev          # exactly uv.lock, hash-verified
      - run: uv pip check                          # every package's requirements are satisfied
      - run: uv run --no-sync python -m pytest -q  # unit tests + harness evals; no broker or API key
