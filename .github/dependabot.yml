version: 2
updates:
  - package-ecosystem: uv             # uv.lock: re-resolves the whole graph, so coupled packages
    directory: /                      # (pydantic + pydantic-core) always move together
    schedule: { interval: monthly }
    groups:                           # one PR per month for all Python updates
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions # Actions are pinned to commit SHAs
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker         # Dockerfile base image digest
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker-compose # ib-gateway image digest
    directory: /
    schedule: { interval: monthly }
